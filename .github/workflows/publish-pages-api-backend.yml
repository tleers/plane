name: Publish v1.3.1 Pages API backend

on:
  workflow_dispatch:
  push:
    branches:
      - shade/v1.3.1-pages-api-pr-9528

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish ARM64 backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested backport
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-backend:v1.3.1-pages-api.1
            ghcr.io/${{ github.repository_owner }}/plane-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v1.3.1-pages-api.1
